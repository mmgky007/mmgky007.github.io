<title>Guo Kaiyuan</title>

<style>
:root{--ground:#FFFFFF;--surface:#F4F2F1;--ink:#000;--ink-2:#37332F;--ink-3:#7C7773;--rule:#DCD7D3;--accent:#FC4600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#000;--surface:#121110;--ink:#FFF;--ink-2:#CAC5C1;--ink-3:#88837F;--rule:#2A2725;--accent:#FF5C21}}
:root[data-theme="dark"]{--ground:#000;--surface:#121110;--ink:#FFF;--ink-2:#CAC5C1;--ink-3:#88837F;--rule:#2A2725;--accent:#FF5C21}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--ground);color:var(--ink);
  font-family:"Neue Haas Grotesk Display Pro","Helvetica Neue",Helvetica,Archivo,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
.box{width:100%;max-width:400px}
.name{font-size:1.9rem;font-weight:800;letter-spacing:-.045em;line-height:1;display:flex;align-items:baseline;gap:.2em}
.dot{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--accent)}
.note{margin:22px 0 28px;font-size:.92rem;line-height:1.55;color:var(--ink-2);max-width:34ch}
label{display:block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3);margin-bottom:8px}
.row{display:flex;gap:0;border:1px solid var(--rule);transition:border-color .2s}
.row:focus-within{border-color:var(--ink)}
.row.bad{border-color:var(--accent);animation:sh .35s}
@keyframes sh{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1rem;padding:13px 14px;outline:none}
button{border:0;background:var(--ink);color:var(--ground);font:inherit;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;padding:0 18px;cursor:pointer}
button:hover{background:var(--accent);color:#fff}
.msg{min-height:1.4em;margin-top:12px;font-size:.78rem;color:var(--accent)}
.foot{margin-top:40px;font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3)}
</style>
</head>

    <button type="submit">Enter</button>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>

</form>

  }
  function show(raw){
    return importRaw(raw).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct)})
      .then(function(pt){
        var html=new TextDecoder().decode(pt);
        document.open();document.write(html);document.close();
      });
  }
  // remembered key?
  try{
    var s=JSON.parse(localStorage.getItem(KEYNAME)||'null');
    if(s&&s.exp>Date.now()&&s.salt===SALT){show(u8(s.k)).catch(function(){localStorage.removeItem(KEYNAME)})}
  }catch(e){}

  var f=document.getElementById('f'),row=document.getElementById('row'),msg=document.getElementById('msg'),pw=document.getElementById('pw');
  f.addEventListener('submit',function(e){
    e.preventDefault();msg.textContent='';row.classList.remove('bad');
    var v=pw.value;if(!v)return;
    f.style.opacity=.6;
    derive(v).then(function(raw){
      return show(raw).then(function(){
        try{localStorage.setItem(KEYNAME,JSON.stringify({k:b64(raw),salt:SALT,exp:Date.now()+DAYS*864e5}))}catch(e){}
      });
    }).catch(function(){
      f.style.opacity=1;row.classList.add('bad');msg.textContent='That password did not work.';pw.select();
    });
  });
})();
</script>
</body>
</html>
